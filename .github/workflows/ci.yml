name: CI

# Restored 2026-08-27. `main` branch protection requires four status checks —
# test, clippy, fmt, "Kani Proofs" — but this repo had NO .github/workflows at all, so none
# of them could ever report and every PR to main was permanently unmergeable. The last
# workflow run was 2026-04-18.
#
# The job NAMES below are chosen to match those required contexts exactly. Renaming a job
# here silently re-blocks every PR, so don't.

on:
  push:
    # `fix/**` added 2026-09-15 (H-4). Every fix in this project is developed on its own
    # `fix/<id>` branch and pushed BEFORE a PR exists, and a CI change that has never
    # executed on a runner is not a verified change — the first real run of the audit-scan
    # guard failed on a path spelling that only the runner's nested checkout layout
    # produces. Running CI on the branch push is how that gets caught before review.
    branches: [main, master, 'fix/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  # Keyed on the PR number when there is one, so the `push` run of a `fix/**` branch and
  # the `pull_request` run of the PR opened from it share one group and cancel each other
  # instead of both burning a full Kani matrix on the same SHA. For a push to main there
  # is no PR number and this is exactly the previous key (`refs/heads/main`).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      # --no-fail-fast matters: without it cargo stops at the first failing SUITE and the
      # totals it prints are a truncated subset. That has produced wrong pass/fail numbers
      # in this project before.
      - name: Test
        run: cargo test --no-fail-fast --verbose

  audit-scan:
    name: audit-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Added 2026-09-15 (H-2). The `test` job above runs the DEFAULT feature set, in which
    # the O(N) audit-scan invariants do not exist: `validate_shape_full_audit_scan`
    # (src/v16.rs:8318) is `#[cfg(any(test, kani, feature = "audit-scan"))]`, and an
    # integration test builds the lib as a DEPENDENCY, so cfg(test) is not set on the lib
    # and the scan compiles out. `validate_shape_audit_scan` (:8610-8619) is then a no-op
    # returning Ok(()). That is why `cargo test --test v16_spec_tests` reported 180/0 while
    # `--features audit-scan` reported 172/8: eight fixtures had been merged green, over
    # five separate PRs, in a build that never ran the checks they broke.
    #
    # Nothing at 2c38570a ran this feature — no workflow, script, Makefile or justfile —
    # so the split the in-tree tripwire module warns about in its own doc
    # (src/v16.rs:23902-23913: "a state the default build commits and the audit build
    # rejects — a split invisible to anyone not running the audit feature") had no gate at
    # all. This job is that gate. It is deliberately a SEPARATE job rather than an extra
    # step on `test`: the job names above are required status contexts on main and must not
    # move, and a second job also keeps the two builds' caches and failures distinct.
    #
    # This job is NOT yet a required context in branch protection; adding it there is a
    # repo-settings change, not a workflow one.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      # WIDENED 2026-09-15 (AS-03), from `--test v16_spec_tests` + `--lib` to --all-targets.
      #
      # The original two steps were scoped for a measured reason, recorded when this job was
      # added: `cargo test --features audit-scan --no-fail-fast` across every target was NOT
      # green — tests/grief_econ_final.rs was 5 passed / 2 failed (7/0 by default), so
      # --all-targets would have landed this job red on day one. That failure is now fixed:
      # its `drain_only_holdout` fixture hand-wrote a one-sided residual OI (oi_eff_long_q =
      # oi, oi_eff_short_q = 0) on an Active asset in a Live market, which the matched-book
      # conjunct at src/v16.rs:8501-8503 rejects, and never mirrored the slot's
      # resolved_payout_blocker_count into the header total (:8331-8332). Both are fixture
      # drift, repaired in tests/ only.
      #
      # Measured before widening, on this commit: `cargo test --features audit-scan
      # --no-fail-fast --all-targets` is green on every target — lib 67, backing_double_claim_fuzz
      # 13, deposit_live_only_448 4, grief_econ_final 7, lp_burn_repro 36,
      # no_seniority_bypass_143 3, resolved_insolvent_fuzz 2, v16_spec_tests 179 (180 minus the
      # one test cfg-gated out of this build), and 0-test proof/fuzz targets. Widening is what
      # makes the gate cover the whole tree rather than the one suite that happened to be
      # triaged; a new red target still names itself in the output, so failures stay
      # attributable.
      #
      # --all-targets excludes doc-tests; this crate has none (`Doc-tests percolator` reports
      # 0 passed), so nothing is dropped by not running them here.
      - name: All targets under --features audit-scan
        run: cargo test --features audit-scan --no-fail-fast --verbose --all-targets

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # -W, not -D: the crate currently has ~57 warnings. Making them errors would fail every
      # PR for pre-existing debt rather than for anything the PR did.
      - name: Clippy
        run: cargo clippy --all-targets -- -W clippy::all

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PINNED. `stable` moves, and rustfmt output changes between releases: this job
      # failed on a file that `rustfmt --check` accepts locally (exit 0, no diff) purely
      # because the runner had a newer stable. A moving formatter is a flaky required check.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt
      # SCOPED TO THE FILES THIS PR TOUCHES, deliberately.
      #
      # `cargo fmt --check` over the whole repo fails today: there are 243 diff hunks,
      # including src/v16.rs. Reformatting them is NOT deployment-neutral — measured
      # 2026-08-27, running `cargo fmt` changed the compiled wrapper .so from 2e88fb83… to
      # 9f25ac81…, because release builds embed file/line in panic paths. So a repo-wide
      # reformat has to be sequenced deliberately against a deploy, not smuggled in with a
      # CI restoration.
      #
      # Checking only changed files still enforces the property that matters right now — no
      # NEW drift — and reports honestly instead of being permanently red. Switch this to a
      # whole-repo `cargo fmt --check` once the reformat has landed.
      - name: Check formatting of changed files
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            echo "not a pull_request event — checking the last commit's files"
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.rs' || true)
          if [ -z "$FILES" ]; then
            echo "no Rust files changed — nothing to check"
            exit 0
          fi
          echo "checking:"; echo "$FILES" | sed 's/^/  /'
          # shellcheck disable=SC2086
          rustfmt --edition 2021 --check $FILES


  # ---------------------------------------------------------------------------
  # Kani, PR tier. REWRITTEN 2026-09-15 (H-4).
  #
  # What was here before: a loop over TWO harness names out of a 331-harness census
  # (0.6 %), self-described in this file as "a deliberate smoke check, not verification
  # coverage". It was honest about being narrow, but it meant that every "CI green"
  # merge carried essentially no proof coverage, and the per-fix Kani evidence in this
  # project came from people running harnesses by hand for hours.
  #
  # What is here now, and what it is NOT:
  #   - `Kani shard N` (matrix): a CURATED REQUIRED SET, .github/kani/pr_required.tsv,
  #     covering every kernel the 2026-09 fix loop touched (F-02, F-02 proofs, F-03,
  #     F-04, I2, K, Q, Q2) plus the two harnesses repaired in #147 that this job has
  #     always run. Each is run on its own with `--exact --harness`, never as a bare
  #     `cargo kani` over the suite, and each must satisfy every cover property it
  #     declares.
  #   - `Kani Proofs` (aggregator): the REQUIRED status context. It keeps that exact
  #     name because branch protection on main requires it; renaming it re-blocks every
  #     PR. It runs `if: always()` and fails when any shard did not succeed — a plain
  #     `needs:` without `always()` would leave it SKIPPED on a shard failure, and a
  #     skipped required check does not block a merge.
  #   - It is STILL NOT the full census. 331 harnesses take hours; the full sweep runs
  #     in .github/workflows/kani-full.yml on a schedule and on demand. This job is the
  #     part that fits in a PR.
  #
  # Selection rule for pr_required.tsv, so the list can be maintained honestly:
  #   (1) the harness is named in a fix dossier as evidence for a landed fix, and
  #   (2) it declares at least one kani::cover! and satisfies all of them (an in-tree
  #       harness with no covers reports SUCCESSFUL while proving nothing — 28 of the
  #       331 are in that state today; they run in the scheduled tier and are reported
  #       there as EVIDENCE-FREE, and they are barred from this list by
  #       `kani_census.py check-required`), and
  #   (3) it is cheap enough to keep a shard under ~20 minutes. The measured wall time
  #       is a column of pr_required.tsv, and the excluded slow harnesses are listed at
  #       the bottom of that file with the measurement that excluded them.
  # ---------------------------------------------------------------------------
  kani-shard:
    name: Kani shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the whole matrix: every shard codegens the identical test
          # target under cfg(kani), so any shard's cache warms all of them. Without a
          # shared key each shard gets its own and pays the cold codegen every run.
          shared-key: kani
      # Cheap checks FIRST, before the Kani install and before any solver runs, so a
      # stale list fails in seconds instead of after 20 minutes of CBMC.
      - name: Census — tree vs kani-list.json
        run: python3 scripts/kani_census.py check
      - name: Required set exists in the tree, is unique, and declares covers
        run: |
          set -euo pipefail
          # Filter comments BEFORE cut: cutting first would turn `# shard<TAB>harness`
          # into a line that no longer starts with '#'.
          grep -v -e '^#' -e '^[[:space:]]*$' .github/kani/pr_required.tsv \
            | cut -f2,3 > /tmp/required_names.tsv
          python3 scripts/kani_census.py check-required /tmp/required_names.tsv
      - name: Install Kani
        run: |
          set -euo pipefail
          # PINNED. Harness counts, the kani-list.json schema and which unstable flags a
          # harness needs all move between Kani releases; scripts/run_kani_full_audit.sh
          # and README.md name the same version.
          cargo install --locked kani-verifier@0.67.0
          cargo kani setup
          cargo kani --version
      - name: Build the shard list
        run: |
          set -euo pipefail
          mkdir -p kani-out
          awk -F'\t' -v s="${{ matrix.shard }}" \
            '$0 !~ /^#/ && $1 == s { print $2 "\t" $3 }' \
            .github/kani/pr_required.tsv > kani-out/shard.txt
          N=$(grep -c . kani-out/shard.txt || true)
          echo "shard ${{ matrix.shard }}: $N harness name(s)"
          cat kani-out/shard.txt
          # A shard that selected nothing is a broken matrix, not a pass.
          if [ "${N:-0}" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }} selected 0 harnesses from .github/kani/pr_required.tsv"
            exit 1
          fi
      - name: Verify
        env:
          KANI_REQUIRE_COVERS: '1'
        run: scripts/kani_ci_shard.sh kani-out/shard.txt kani-out/results.tsv
      - name: Shard summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Kani shard ${{ matrix.shard }}"
            echo ""
            echo '```'
            cat kani-out/results.tsv 2>/dev/null || echo "(no results)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kani-pr-tier-shard-${{ matrix.shard }}
          path: kani-out/
          retention-days: 14

  kani:
    # THE REQUIRED CONTEXT. Do not rename: branch protection on main requires the
    # string "Kani Proofs" and a rename makes every PR unmergeable.
    name: Kani Proofs
    needs: [kani-shard]
    # `always()` is load-bearing: with the default `if`, a failing shard makes this job
    # SKIPPED, and GitHub treats a skipped required check as satisfied. That would turn
    # a Kani failure into a green merge.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kani-pr-tier-shard-*
          path: shards
          merge-multiple: false
      - name: Every shard succeeded, and every required harness reported
        run: |
          set -euo pipefail
          RESULT='${{ needs.kani-shard.result }}'
          echo "kani-shard matrix result: $RESULT"

          EXPECTED=$(grep -vc -e '^#' -e '^[[:space:]]*$' .github/kani/pr_required.tsv)
          echo "required harnesses declared: $EXPECTED"

          printf 'harness\tstatus\twall_s\trc\tverified\tfailures\ttotal\tcovers_sat\tcovers_total\tchecks_failed\tchecks_total\n' > all.tsv
          find shards -name results.tsv -print0 \
            | xargs -0 -I{} sh -c 'tail -n +2 "{}"' >> all.tsv || true
          GOT=$(( $(wc -l < all.tsv) - 1 ))
          echo "harness results collected: $GOT"

          sort -t"$(printf '\t')" -k3,3nr all.tsv | head -100 || true

          # Exit code alone is not a measurement: a shard whose list selected nothing,
          # or whose upload was lost, exits 0 with no rows. Assert the COUNT.
          if [ "$GOT" -ne "$EXPECTED" ]; then
            echo "::error::collected $GOT harness results but .github/kani/pr_required.tsv declares $EXPECTED"
            exit 1
          fi
          BAD=$(tail -n +2 all.tsv | awk -F'\t' '$2 != "OK"' || true)
          if [ -n "$BAD" ]; then
            echo "::error::harnesses not OK:"
            echo "$BAD"
            exit 1
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::Kani PR tier failed: shard matrix result = $RESULT"
            exit 1
          fi
          TOTALWALL=$(tail -n +2 all.tsv | awk -F'\t' '{s+=$3} END {print s+0}')
          SLOWEST=$(tail -n +2 all.tsv | sort -t"$(printf '\t')" -k3,3nr | head -1)
          {
            echo "### Kani Proofs — PR tier"
            echo ""
            echo "- required harnesses: **$EXPECTED**, all OK"
            echo "- non-vacuity: every harness satisfied **all** of its declared cover properties"
            echo "- summed solver wall time across shards: **${TOTALWALL}s**"
            echo "- slowest: \`$(echo "$SLOWEST" | cut -f1)\` at $(echo "$SLOWEST" | cut -f3)s"
            echo ""
            echo "This is the curated PR tier, not the census. The full $(python3 scripts/kani_census.py census | wc -l | tr -d ' ')-harness sweep runs in \`Kani full census\` (nightly / workflow_dispatch)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kani-pr-tier-all
          path: all.tsv
          retention-days: 14
